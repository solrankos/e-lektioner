    while (out.length < ROUNDS && tries++ < 5000){
      const lat = lats[Math.floor(Math.random() * lats.length)], lon = lons[Math.floor(Math.random() * lons.length)];
      const k = lat + "," + lon; if (seen.has(k)) continue;
      seen.add(k); out.push({lat, lon});
    }
    return out;
  }

  function newGame(){
    questions = makeQuestions(); idx = 0; score = 0; history = [];
    $("summary").hidden = true; $("bottom").hidden = false;
    document.querySelectorAll("[data-level]").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === level ? "true" : "false"));
    showQuestion();
  }

  function showQuestion(){
    guess = null; checked = false;
    resultG.innerHTML = ""; guessG.style.display = "none";
    $("qnum").textContent = R.name + ": fråga " + (idx + 1) + " av " + ROUNDS;
    $("target").textContent = coordTxt(questions[idx], R.dec);
    $("score").textContent = score;
    feedback.className = "feedback";
    feedback.innerHTML = matchMedia("(pointer: coarse)").matches
      ? "<p>Tryck på kartan och dra. Punkten visas en bit ovanför fingret så att du ser den.</p>"
      : "<p>Klicka på kartan där du tror att platsen ligger. Du kan dra punkten för att finjustera.</p>";
    actionBtn.textContent = "Kontrollera"; actionBtn.disabled = true;
    updateReadout();
  }

  function setGuess(lon, lat){
    const [w0, e0, s0, n0] = R.b;
    guess = {lon: Math.max(w0, Math.min(e0, lon)), lat: Math.max(s0, Math.min(n0, lat))};
    const x = P.X(guess.lon), y = P.Y(guess.lat);
    guessG.style.display = "";
    gDot.setAttribute("cx", x); gDot.setAttribute("cy", y);
    gh.setAttribute("y1", y); gh.setAttribute("y2", y);
    gv.setAttribute("x1", x); gv.setAttribute("x2", x);
    actionBtn.disabled = false;
    updateReadout();
  }

  function updateReadout(){
    const on = $("practice").checked && guess && !checked;
    readout.hidden = !on;
    if (on) readout.textContent = coordTxt(guess, R.dec);
  }

  function check(){
    if (!guess) return;
    checked = true;
    const t = questions[idx], tol = L().tol, d = R.dec;
    const dLat = guess.lat - t.lat, dLon = guess.lon - t.lon;
    const ok = Math.abs(dLat) <= tol && Math.abs(dLon) <= tol;
    if (ok) score++;
    history.push({t, g:{...guess}, ok});
    $("score").textContent = score;

    const tx = P.X(t.lon), ty = P.Y(t.lat);
    if (!ok) el("line", {x1:P.X(guess.lon), y1:P.Y(guess.lat), x2:tx, y2:ty, stroke:"var(--wrong)", "stroke-width":2, "stroke-dasharray":"5 4"}, resultG);
    el("line", {x1:tx, x2:tx, y1:0, y2:P.H, stroke:"var(--target)", "stroke-width":1.5, opacity:.7}, resultG);
    el("line", {y1:ty, y2:ty, x1:0, x2:P.W, stroke:"var(--target)", "stroke-width":1.5, opacity:.7}, resultG);
    el("circle", {cx:tx, cy:ty, r:8, fill:"var(--target)", stroke:"#fff", "stroke-width":2.5}, resultG);
    svg.appendChild(guessG);

    const lines = [];
    if (ok){
      lines.push("<strong>Rätt!</strong> Du satte punkten på " + coordTxt(guess, d) + ".");
    } else {
      lines.push("<strong>Inte riktigt.</strong> Du satte punkten på " + coordTxt(guess, d) + ". Den gröna punkten visar " + coordTxt(t, d) + ".");
      const near = (a, b) => Math.abs(a - b) <= tol;
      const parts = [];
      if (near(guess.lat, t.lon) && near(guess.lon, t.lat) && !near(guess.lat, t.lat)){
        parts.push("Det ser ut som att du bytt plats på bredd och längd. Breddgraden kommer först och visar norr–söder.");
      } else {
        if (Math.abs(dLat) > tol){
          if (t.lat !== 0 && near(guess.lat, -t.lat)) parts.push("Kolla N och S: N betyder norr om ekvatorn, S betyder söder om den.");
          else parts.push("Din punkt ligger " + num(dLat, d) + "° för långt " + (dLat > 0 ? "norrut" : "söderut") + ".");
        }
        if (Math.abs(dLon) > tol){
          if (t.lon !== 0 && near(guess.lon, -t.lon)) parts.push("Kolla Ö och V: Ö betyder öster om nollmeridianen, V betyder väster om den.");
          else parts.push("Din punkt ligger " + num(dLon, d) + "° för långt " + (dLon > 0 ? "österut" : "västerut") + ".");
        }
      }
      if (parts.length) lines.push(parts.join(" "));
    }
    feedback.className = "feedback " + (ok ? "good" : "bad");
    feedback.innerHTML = lines.map(l => "<p>" + l + "</p>").join("");
    actionBtn.textContent = idx < ROUNDS - 1 ? "Nästa fråga" : "Se resultat";
    updateReadout();
  }

  function next(){ if (idx < ROUNDS - 1){ idx++; showQuestion(); } else finish(); }

  function finish(){
    $("bottom").hidden = true;
    resultG.innerHTML = ""; guessG.style.display = "none";
    history.forEach(h => el("circle", {cx:P.X(h.t.lon), cy:P.Y(h.t.lat), r:7, fill: h.ok ? "var(--target)" : "var(--wrong)", stroke:"#fff", "stroke-width":2}, resultG));
    $("qnum").textContent = R.name + ": klart";
    $("target").textContent = score + " av " + ROUNDS + " rätt";
    $("sumTitle").textContent = score === ROUNDS ? "Alla rätt, snyggt!" : score >= 7 ? "Bra jobbat!" : score >= 4 ? "Bra början. Prova igen!" : "Öva lite till, du lär dig snabbt.";
    $("sumList").innerHTML = history.map(h => "<li><span class='" + (h.ok ? "ok" : "no") + "'>" + (h.ok ? "Rätt" : "Fel") + "</span> " + coordTxt(h.t, R.dec) + (h.ok ? "" : " (du satte " + coordTxt(h.g, R.dec) + ")") + "</li>").join("");
    $("summary").hidden = false;
  }

  const TOUCH_LIFT = 70;
  function toMap(e, lift){
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY - (lift || 0);
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    if (checked || !$("summary").hidden) return;
    const touch = e.pointerType === "touch" || e.pointerType === "pen";
    const finger = toMap(e);
    const inMap = finger.x >= 0 && finger.x <= P.W && finger.y >= 0 && finger.y <= P.H;
    if (!inMap && !guess) return;
    svg.setPointerCapture(e.pointerId);
    if (touch){
      const p = toMap(e, TOUCH_LIFT);
      setGuess(P.LON(Math.max(0, Math.min(P.W, p.x))), P.LAT(Math.max(0, Math.min(P.H, p.y))));
      drag = {touch:true};
      return;
    }
    const p = finger;
    if (!(guess && Math.hypot(p.x - P.X(guess.lon), p.y - P.Y(guess.lat)) < 30)){
      setGuess(P.LON(Math.max(0, Math.min(P.W, p.x))), P.LAT(Math.max(0, Math.min(P.H, p.y))));
    }
    drag = {p, start:{...guess}};
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    if (drag.touch){
      const q = toMap(e, TOUCH_LIFT);
      setGuess(P.LON(Math.max(0, Math.min(P.W, q.x))), P.LAT(Math.max(0, Math.min(P.H, q.y))));
      return;
    }
    const p = toMap(e);
    setGuess(drag.start.lon + (p.x - drag.p.x) / (P.K * P.c), drag.start.lat - (p.y - drag.p.y) / P.K);
  });
  const endDrag = () => { drag = null; };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  svg.addEventListener("keydown", e => {
    if (checked || !$("summary").hidden){ if (e.key === "Enter" && checked){ e.preventDefault(); next(); } return; }
    const base = R.dec ? 0.1 : 1, s = e.shiftKey ? base * 10 : base;
    const moves = {ArrowUp:[0,s], ArrowDown:[0,-s], ArrowLeft:[-s,0], ArrowRight:[s,0]};
    if (moves[e.key]){
      e.preventDefault();
      const [w0, e0, s0, n0] = R.b;
      const g = guess || {lon:(w0 + e0) / 2, lat:(s0 + n0) / 2};
      setGuess(roundTo(g.lon + moves[e.key][0], 1), roundTo(g.lat + moves[e.key][1], 1));
    } else if (e.key === "Enter" && guess){ e.preventDefault(); check(); }
  });

  actionBtn.addEventListener("click", () => checked ? next() : check());
  $("again").addEventListener("click", newGame);
  $("practice").addEventListener("change", updateReadout);
  document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => { level = b.dataset.level; newGame(); }));

  const tabs = $("tabs");
  REGIONS.forEach(r => { const a = document.createElement("a"); a.href = "#" + r.id; a.textContent = r.name; a.dataset.id = r.id; tabs.appendChild(a); });

  function route(){
    const id = (location.hash || "").slice(1);
    R = REGIONS.find(r => r.id === id) || REGIONS[0];
    tabs.querySelectorAll("a").forEach(a => {
      if (a.dataset.id === R.id){ a.setAttribute("aria-current", "page"); a.scrollIntoView({block:"nearest", inline:"nearest"}); }
      else a.removeAttribute("aria-current");
    });
    document.title = "Placera koordinaten: " + R.name + " – e-lektioner";
    buildMap();
    newGame();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
