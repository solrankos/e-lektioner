<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globen och gradnätet – e-lektioner</title>
<meta name="description" content="Vrid globen och visa breddgrader, längdgrader, ekvatorn och vändkretsarna.">
<link rel="preload" href="../../assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/css/site.css">
<script src="../../assets/js/theme.js"></script>
<style>
main{max-width:1040px;margin:0 auto;padding:20px 18px 36px;display:grid;gap:20px 40px;grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:860px){ main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);padding-top:40px} }
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 22px;max-width:40ch}
.stage{position:relative;width:100%;max-width:560px;margin:0 auto}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;color:var(--muted);font-size:.9rem}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:700;font-size:.95rem;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}
.info{background:var(--panel);border-left:4px solid var(--info-c,var(--ink));padding:14px 18px;border-radius:4px 12px 12px 4px}
.info h2{font-size:1.15rem;margin:0 0 4px}
.info p{margin:0;max-width:52ch}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-in">
    <a class="brand" href="../../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4" ry="9.5"/><path d="M2.5 12h19M4 7h16M4 17h16"/></svg>
      e-lektioner
    </a>
    <ol class="crumbs" aria-label="Du är här">
      <li><a href="../../#geografi">Geografi</a></li>
      <li aria-current="page">Globen och gradnätet</li>
    </ol>
    <button class="theme-toggle" type="button">Mörkt läge</button>
  </div>
</header>

<main>
  <div class="stage">
    <canvas id="globe" aria-label="Jordglob som går att vrida"></canvas>
    <div class="stage-bar">
      <span>Dra i globen för att vrida den.</span>
      <button class="ghost" id="spin" type="button" aria-pressed="true">Pausa rotation</button>
    </div>
  </div>

  <section>
    <h1>Globen och gradnätet</h1>
    <p class="lede">Välj vilka linjer som ska visas på globen.</p>

    <fieldset>
      <legend>Hela nätet</legend>
      <div class="chips" role="group">
        <button class="chip" type="button" data-mode="gradnat">Gradnät</button>
        <button class="chip" type="button" data-mode="bredd">Breddgrader</button>
        <button class="chip" type="button" data-mode="langd">Längdgrader</button>
        <button class="chip" type="button" data-mode="inga">Inga linjer</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>En linje i taget</legend>
      <div class="chips" role="group">
        <button class="chip" type="button" data-mode="ekvator"><span class="sw" style="background:var(--hl-equator)"></span>Ekvatorn</button>
        <button class="chip" type="button" data-mode="noll"><span class="sw" style="background:var(--hl-meridian)"></span>Nollmeridianen</button>
        <button class="chip" type="button" data-mode="kraftan"><span class="sw" style="background:var(--hl-tropic)"></span>Kräftans vändkrets</button>
        <button class="chip" type="button" data-mode="stenbock"><span class="sw" style="background:var(--hl-tropic)"></span>Stenbockens vändkrets</button>
      </div>
    </fieldset>

    <div class="info" id="info" aria-live="polite">
      <h2 id="info-title"></h2>
      <p id="info-text"></p>
    </div>
  </section>
</main>

<script src="../../assets/vendor/d3-7.8.5.min.js"></script>
<script>
(function(){
  const TROPIC = 23.44;

  const RAW = [
    [[-168,66],[-156,71],[-140,70],[-125,70],[-110,73],[-95,72],[-85,69],[-80,63],[-94,59],[-90,57],[-82,52],[-79,55],[-77,62],[-70,60],[-64,60],[-60,55],[-56,52],[-60,47],[-66,45],[-70,42],[-74,40],[-76,35],[-81,31],[-80,26],[-82,25],[-83,29],[-89,30],[-94,29],[-97,26],[-97,22],[-95,19],[-91,19],[-87,21],[-88,16],[-83,15],[-83,10],[-79,9],[-77,8],[-80,7],[-85,10],[-88,13],[-92,15],[-96,16],[-105,20],[-110,24],[-115,30],[-117,32],[-121,35],[-124,40],[-124,46],[-127,50],[-133,55],[-140,60],[-150,61],[-155,58],[-163,55],[-158,58],[-165,60],[-165,64]],
    [[-73,78],[-60,82],[-35,83],[-20,82],[-18,76],[-22,70],[-32,68],[-40,65],[-44,60],[-50,62],[-54,67],[-56,72],[-66,76]],
    [[-77,8],[-72,12],[-62,11],[-52,5],[-50,0],[-44,-2],[-35,-5],[-35,-9],[-39,-14],[-41,-22],[-48,-26],[-53,-34],[-58,-35],[-57,-39],[-65,-41],[-65,-45],[-68,-50],[-69,-55],[-74,-53],[-75,-46],[-73,-38],[-71,-30],[-70,-18],[-76,-14],[-81,-6],[-80,0],[-78,2]],
    [[-9,43],[-9,37],[-6,36],[-1,37],[3,42],[5,43],[9,44],[12,42],[16,38],[18,40],[13,45],[19,42],[23,37],[26,40],[29,41],[36,41],[36,36],[35,33],[34,31],[35,28],[39,21],[43,13],[45,13],[52,16],[58,21],[56,26],[50,30],[48,30],[52,27],[56,27],[61,25],[67,24],[72,21],[73,16],[77,8],[80,13],[80,16],[87,21],[91,22],[94,17],[98,16],[98,8],[101,3],[104,1],[103,5],[100,13],[105,9],[109,12],[108,17],[106,20],[110,21],[117,23],[121,28],[122,31],[119,35],[122,37],[118,38],[121,41],[126,38],[127,35],[129,36],[130,42],[135,44],[140,48],[141,53],[137,54],[141,59],[150,59],[156,58],[162,56],[160,61],[165,62],[178,64],[179.9,66],[179.9,69],[170,70],[160,70],[150,71],[140,72],[130,71],[120,73],[110,76],[100,78],[90,75],[80,73],[70,73],[68,69],[60,70],[50,68],[44,68],[40,66],[33,69],[25,71],[15,69],[8,63],[5,59],[8,58],[11,59],[13,56],[10,54],[8,55],[6,53],[3,51],[-2,48],[-4,48],[-1,46],[-2,44]],
    [[-17,21],[-16,15],[-17,12],[-13,8],[-8,4],[-2,5],[5,6],[9,4],[9,-1],[12,-5],[13,-12],[12,-17],[15,-27],[18,-34],[20,-35],[26,-34],[32,-29],[35,-24],[40,-16],[40,-10],[39,-4],[43,2],[51,11],[44,11],[43,13],[39,16],[36,22],[34,28],[32,31],[25,32],[20,31],[15,32],[10,34],[10,37],[3,37],[-2,35],[-6,36],[-10,30],[-13,27]],
    [[114,-22],[116,-35],[123,-34],[131,-31],[138,-35],[141,-38],[147,-39],[150,-37],[153,-28],[153,-25],[146,-19],[145,-14],[142,-11],[141,-17],[136,-15],[137,-12],[131,-11],[126,-14],[122,-18]],
    [[-5,50],[1,51],[2,53],[-2,56],[-2,58],[-5,59],[-6,56],[-5,54],[-3,54],[-5,52]],
    [[-10,52],[-6,52],[-6,55],[-8,55]],
    [[-24,65],[-14,66],[-14,64],[-22,63]],
    [[130,31],[132,34],[135,34],[140,35],[141,38],[142,42],[145,43],[141,45],[140,41],[136,37],[131,35]],
    [[44,-25],[47,-25],[50,-15],[49,-12],[44,-16]],
    [[109,1],[111,-3],[116,-4],[119,1],[117,7],[113,3]],
    [[95,5],[98,4],[106,-6],[101,-3]],
    [[131,-1],[141,-3],[150,-10],[143,-9],[137,-5]],
    [[172,-34],[178,-38],[174,-41],[172,-44],[167,-46],[171,-41]]
  ];
  const ant = d3.range(-180,180,10).map(l => [l, -71 + 3.5*Math.sin(l*Math.PI/50)]);
  ant.splice(12,0,[-62,-64],[-58,-63]);
  RAW.push(ant);

  function fixRing(r){
    const ring = r.slice();
    const a = ring[0], b = ring[ring.length-1];
    if (a[0]!==b[0] || a[1]!==b[1]) ring.push(a);
    if (d3.geoArea({type:"Polygon",coordinates:[ring]}) > 2*Math.PI) ring.reverse();
    return ring;
  }
  const land = {type:"MultiPolygon", coordinates: RAW.map(r => [fixRing(r)])};

  const parallel = lat => ({type:"LineString",coordinates:d3.range(-180,180.1,2).map(l=>[l,lat])});
  const meridian = lon => ({type:"LineString",coordinates:d3.range(-90,90.1,2).map(l=>[lon,l])});
  const latLines = d3.range(-75,76,15).map(parallel);
  const lonLines = d3.range(-180,180,15).map(meridian);

  const INFO = {
    gradnat:{t:"Gradnät", c:"var(--ink)", p:"Gradnätet består av breddgrader och längdgrader. Tillsammans gör de att varje plats på jorden kan anges med koordinater."},
    bredd:{t:"Breddgrader", c:"var(--ink)", p:"Breddgrader går runt jorden, parallellt med ekvatorn. De visar hur långt norr eller söder om ekvatorn en plats ligger, från 0° vid ekvatorn till 90° vid polerna."},
    langd:{t:"Längdgrader", c:"var(--ink)", p:"Längdgrader, eller meridianer, går från nordpolen till sydpolen. De visar hur långt öster eller väster om nollmeridianen en plats ligger, upp till 180°."},
    inga:{t:"Inga linjer", c:"var(--line)", p:"Globen utan linjer. Välj en knapp för att visa gradnätet eller en enskild linje."},
    ekvator:{t:"Ekvatorn", c:"var(--hl-equator)", p:"Ekvatorn är breddgraden 0°. Den delar jorden i ett norra och ett södra halvklot och är ungefär 40 000 km lång."},
    noll:{t:"Nollmeridianen", c:"var(--hl-meridian)", p:"Nollmeridianen är längdgraden 0°. Den går genom Greenwich i London och delar jorden i ett östra och ett västra halvklot."},
    kraftan:{t:"Kräftans vändkrets", c:"var(--hl-tropic)", p:"Kräftans vändkrets ligger på ungefär 23,4° nordlig bredd. Där står solen rakt ovanför huvudet mitt på dagen vid sommarsolståndet, runt 21 juni."},
    stenbock:{t:"Stenbockens vändkrets", c:"var(--hl-tropic)", p:"Stenbockens vändkrets ligger på ungefär 23,4° sydlig bredd. Där står solen rakt ovanför huvudet mitt på dagen vid vintersolståndet, runt 21 december."}
  };
  const VIEW = { ekvator:{lat:15}, noll:{lon:5,lat:25}, kraftan:{lat:28}, stenbock:{lat:-28} };

  const canvas = document.getElementById("globe");
  const ctx = canvas.getContext("2d");
  const projection = d3.geoOrthographic().clipAngle(90).precision(0.3);
  const path = d3.geoPath(projection, ctx);

  let rot = [-15,-22,0];
  let mode = "gradnat";
  let spinning = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let dragging = false, anim = null, size = 400, colors = {};

  function readColors(){
    const s = getComputedStyle(document.documentElement);
    const g = n => s.getPropertyValue(n).trim();
    colors = {oa:g("--ocean-a"),ob:g("--ocean-b"),land:g("--land"),edge:g("--land-edge"),grid:g("--grid"),gs:g("--grid-shadow"),
      eq:g("--hl-equator"),mer:g("--hl-meridian"),tr:g("--hl-tropic"),lbg:g("--label-bg"),link:g("--label-ink"),rim:g("--rim")};
  }

  function resize(){
    const w = canvas.parentElement.clientWidth;
    size = Math.min(w, 560);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size*dpr; canvas.height = size*dpr;
    canvas.style.width = size+"px"; canvas.style.height = size+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    projection.scale(size/2 - 10).translate([size/2, size/2]);
    draw();
  }

  const center = () => [-rot[0], -rot[1]];
  const visible = p => d3.geoDistance(p, center()) < 1.3;
  const latTxt = l => l===0 ? "0°" : Math.abs(l)+"° "+(l>0?"N":"S");
  const lonTxt = l => (l===0||Math.abs(l)===180) ? Math.abs(l)+"°" : Math.abs(l)+"° "+(l>0?"Ö":"V");
  const wrap = l => ((l+540)%360)-180;

  function stroke(geo, color, width, shadow){
    ctx.beginPath(); path(geo);
    if (shadow){ ctx.strokeStyle = colors.gs; ctx.lineWidth = width+1.6; ctx.stroke(); }
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }

  function label(coord, text, color, dy){
    if (!visible(coord)) return;
    const [x,y] = projection(coord);
    const fs = Math.max(11, Math.round(size/34));
    ctx.font = `700 ${fs}px "Atkinson Hyperlegible", system-ui, sans-serif`;
    const w = ctx.measureText(text).width + 12, h = fs + 8;
    const yy = y + (dy||0);
    ctx.fillStyle = colors.lbg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w/2, yy - h/2, w, h, h/2); else ctx.rect(x-w/2, yy-h/2, w, h);
    ctx.fill();
    if (color){ ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = colors.link; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x, yy + 1);
  }

  function draw(){
    projection.rotate(rot);
    ctx.clearRect(0,0,size,size);
    const r = projection.scale(), cx = size/2, cy = size/2;

    const grad = ctx.createRadialGradient(cx - r*.35, cy - r*.4, r*.1, cx, cy, r);
    grad.addColorStop(0, colors.oa); grad.addColorStop(1, colors.ob);
    ctx.beginPath(); path({type:"Sphere"}); ctx.fillStyle = grad; ctx.fill();

    ctx.beginPath(); path(land);
    ctx.fillStyle = colors.land; ctx.fill();
    ctx.strokeStyle = colors.edge; ctx.lineWidth = 1; ctx.lineJoin = "round"; ctx.stroke();

    const [clon, clat] = center();
    const thin = Math.max(1, size/420);
    const bold = Math.max(3, size/140);

    if (mode === "gradnat" || mode === "bredd") latLines.forEach(g => stroke(g, colors.grid, thin, true));
    if (mode === "gradnat" || mode === "langd") lonLines.forEach(g => stroke(g, colors.grid, thin, true));

    if (mode === "ekvator") stroke(parallel(0), colors.eq, bold, true);
    if (mode === "noll") stroke(meridian(0), colors.mer, bold, true);
    if (mode === "kraftan") stroke(parallel(TROPIC), colors.tr, bold, true);
    if (mode === "stenbock") stroke(parallel(-TROPIC), colors.tr, bold, true);

    ctx.beginPath(); path({type:"Sphere"});
    ctx.strokeStyle = colors.rim; ctx.lineWidth = 1.5; ctx.stroke();

    if (mode === "bredd") d3.range(-75,76,15).forEach(l => label([clon, l], latTxt(l)));
    if (mode === "langd") d3.range(-150,181,30).forEach(l => label([l, Math.max(-45,Math.min(45,clat))], lonTxt(l)));
    if (mode === "ekvator") label([wrap(clon+20), 0], "Ekvatorn 0°", colors.eq, -18);
    if (mode === "noll"){
      if (visible([0,51.5])){
        const [gx,gy] = projection([0,51.5]);
        ctx.beginPath(); ctx.arc(gx,gy,Math.max(3,size/120),0,Math.PI*2);
        ctx.fillStyle = colors.mer; ctx.fill(); ctx.strokeStyle = colors.lbg; ctx.lineWidth = 1.5; ctx.stroke();
        label([0,51.5], "Greenwich", null, -18);
      }
      label([0, Math.max(-50, Math.min(30, clat - 20))], "Nollmeridianen 0°", colors.mer);
    }
    if (mode === "kraftan") label([wrap(clon+20), TROPIC], "Kräftans vändkrets 23,4° N", colors.tr, -18);
    if (mode === "stenbock") label([wrap(clon+20), -TROPIC], "Stenbockens vändkrets 23,4° S", colors.tr, 18);
  }

  function setMode(m){
    mode = m;
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode===m ? "true" : "false"));
    const i = INFO[m];
    document.getElementById("info-title").textContent = i.t;
    document.getElementById("info-text").textContent = i.p;
    document.getElementById("info").style.setProperty("--info-c", i.c);
    const v = VIEW[m];
    if (v){
      const target = [v.lon!=null ? -v.lon : rot[0], -v.lat, 0];
      if (v.lon!=null){
        let d = ((target[0]-rot[0]+540)%360)-180; target[0] = rot[0]+d;
      }
      animateTo(target, v.lon!=null);
    } else draw();
  }

  function animateTo(target, stopSpin){
    if (anim) anim.stop();
    if (stopSpin) setSpin(false);
    const from = rot.slice(), interp = d3.interpolate(from, target);
    const dur = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 900;
    if (!dur){ rot = target; draw(); return; }
    anim = d3.timer(el => {
      const t = d3.easeCubicInOut(Math.min(1, el/dur));
      const v = interp(t);
      rot[1] = v[1]; if (stopSpin) rot[0] = v[0];
      draw();
      if (t >= 1){ anim.stop(); anim = null; }
    });
  }

  const spinBtn = document.getElementById("spin");
  function setSpin(on){
    spinning = on;
    spinBtn.setAttribute("aria-pressed", on ? "true" : "false");
    spinBtn.textContent = on ? "Pausa rotation" : "Starta rotation";
  }
  spinBtn.addEventListener("click", () => setSpin(!spinning));
  setSpin(spinning);
  let last = 0;
  d3.timer(el => {
    const dt = el - last; last = el;
    if (spinning && !dragging){ rot[0] = ((rot[0] + dt*0.008 + 540)%360)-180; draw(); }
  });

  let start = null;
  canvas.addEventListener("pointerdown", e => {
    dragging = true; canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
    if (anim){ anim.stop(); anim = null; }
    start = {x:e.clientX, y:e.clientY, r:rot.slice()};
  });
  canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    const k = 180 / (Math.PI * projection.scale());
    rot[0] = start.r[0] + (e.clientX - start.x)*k;
    rot[1] = Math.max(-90, Math.min(90, start.r[1] - (e.clientY - start.y)*k));
    draw();
  });
  const end = () => { dragging = false; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);

  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });
  new MutationObserver(() => { readColors(); draw(); }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
  window.addEventListener("resize", resize);
  if (document.fonts) document.fonts.ready.then(draw);

  readColors();
  resize();
  setMode("gradnat");
})();
</script>
</body>
</html>
